name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests must not call the live Open Data Hub API or any LLM:
      # they use recorded fixtures and fake advisors, so no secrets are needed here.
      - name: Build, test and enforce rules
        run: ./mvnw -B -ntp verify
